[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "aisos"
version = "0.1.0"
description = "Autonomous AI Security Framework — protect AI apps, APIs, MCP servers, RAG pipelines & more"
authors = [{name = "AI SOS Team"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["security", "ai", "mcp", "rag", "llm", "fastapi", "monitoring"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "structlog>=24.0",
    "aiofiles>=23.0",
    "rich>=13.0",
]

[project.optional-dependencies]
all = [
    "flask>=3.0",
    "langchain-core>=0.1",
    "redis>=5.0",
    "sqlalchemy>=2.0",
]

[project.scripts]
aisos = "cli.aisos_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aisos*", "cli*"]
